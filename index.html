<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1v1 Duel Arena – Online Matchmaking</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

:root {
  --bg: #030712;
  --surface: #111827;
  --border: #374151;
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --accent: #ec4899;
  --danger: #ef4444;
  --success: #10b981;
  --text: #f9fafb;
  --muted: #9ca3af;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

.wrap {
  width: 100%;
  max-width: 800px;
  height: 100vh;
  max-height: 600px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 24px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  position: relative;
  overflow: hidden;
}

.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
  display: none;
}
.screen.active { display: flex; }

h1 {
  font-size: 2.5rem;
  font-weight: 800;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #818cf8, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
p.sub { color: var(--muted); margin-bottom: 30px; font-size: 1.05rem; }

.btn {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 16px 36px;
  font-size: 1.1rem;
  font-weight: 700;
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
}
.btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

input[type="text"] {
  background: #1f2937;
  border: 2px solid var(--border);
  padding: 14px 20px;
  border-radius: 12px;
  color: #fff;
  font-size: 1.1rem;
  width: 100%;
  max-width: 320px;
  margin-bottom: 20px;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
}
input[type="text"]:focus { border-color: var(--primary); }

.status-box {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 15px;
  font-family: monospace;
}
.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid rgba(255,255,255,0.1);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 25px;
}
@keyframes spin { to { transform: rotate(360deg); } }

#game-container {
  flex: 1;
  position: relative;
  width: 100%;
  background: #0b0f19;
  overflow: hidden;
  display: none;
}
#game-container.active { display: block; }

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.hud {
  position: absolute;
  top: 15px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 700;
  font-size: 0.95rem;
  pointer-events: none;
  background: rgba(17, 24, 39, 0.8);
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.controls-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 160px;
  pointer-events: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 30px;
}
.joystick-area {
  width: 110px;
  height: 110px;
  background: rgba(255, 255, 255, 0.05);
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  position: relative;
  pointer-events: auto;
  touch-action: none;
}
.joystick-knob {
  width: 50px;
  height: 50px;
  background: var(--primary);
  border-radius: 50%;
  position: absolute;
  top: 30px;
  left: 30px;
  box-shadow: 0 0 15px var(--primary);
  transition: transform 0.05s linear;
}
.hit-btn-mobile {
  width: 90px;
  height: 90px;
  background: var(--danger);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-weight: 800;
  font-size: 1.1rem;
  cursor: pointer;
  pointer-events: auto;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}
.hit-btn-mobile:active { transform: scale(0.92); }
</style>
</head>
<body>

<div class="wrap">
  <div id="screen-queue" class="screen active">
    <h1>1v1 DUEL ARENA</h1>
    <p class="sub">Zadej své jméno, vstup do fronty a utkej se v souboji na 10 hitů!</p>
    <input type="text" id="username-input" placeholder="Zadej své jméno..." value="Hráč1" maxlength="15">
    <button class="btn" onclick="startQueue()">QUEUE</button>
  </div>

  <div id="screen-matching" class="screen">
    <h1>HLEDÁNÍ SOUPEŘE</h1>
    <div class="spinner"></div>
    <div class="status-box" id="status-text">STATUS: 1/2</div>
    <p class="sub">Čekáme na připojení druhého hráče v síti...</p>
    <button class="btn" style="background:#374151; padding:10px 20px; font-size:0.9rem;" onclick="cancelQueue()">Zrušit</button>
  </div>

  <div id="screen-game" class="screen" style="padding:0;">
    <div id="game-container">
      <div class="hud">
        <span id="hud-p1">Vy: 10 HP</span>
        <span id="hud-vs">VS</span>
        <span id="hud-p2">Soupeř: 10 HP</span>
      </div>
      <canvas id="canvas"></canvas>

      <div class="controls-overlay">
        <div id="joystick" class="joystick-area">
          <div id="knob" class="joystick-knob"></div>
        </div>
        <button class="hit-btn-mobile" onclick="triggerHit()">ÚTOK</button>
      </div>
    </div>
  </div>
</div>

<script>
let canvas, ctx;
let keys = {};
let joystickActive = false;
let joystickVector = { x: 0, y: 0 };
let player = {};
let opponent = {};
let isRhvx0 = false;

function startQueue() {
  const name = document.getElementById('username-input').value.trim() || 'Neznámý';
  document.getElementById('screen-queue').classList.remove('active');
  document.getElementById('screen-matching').classList.add('active');

  let count = 1;
  document.getElementById('status-text').textContent = `STATUS: ${count}/2`;

  localStorage.setItem('duel_queue_player', JSON.stringify({ name, time: Date.now() }));

  const matchInterval = setInterval(() => {
    const otherPlayerRaw = localStorage.getItem('duel_queue_player');
    if (otherPlayerRaw) {
      const pData = JSON.parse(otherPlayerRaw);
      if (pData.name !== name && Date.now() - pData.time < 10000) {
        clearInterval(matchInterval);
        count = 2;
        document.getElementById('status-text').textContent = `STATUS: ${count}/2`;
        setTimeout(() => launchGame(name, pData.name, true), 1000);
        return;
      }
    }

    count++;
    if (count > 2) count = 2;
    document.getElementById('status-text').textContent = `STATUS: ${count}/2`;

    if (count === 2) {
      clearInterval(matchInterval);
      setTimeout(() => launchGame(name, name === 'BotTest' ? 'Hráč2' : 'Bojovník AI', false), 1200);
    }
  }, 1500);
}

function cancelQueue() {
  document.getElementById('screen-matching').classList.remove('active');
  document.getElementById('screen-queue').classList.add('active');
}

function launchGame(myName, oppName, isRealP2) {
  document.getElementById('screen-matching').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');

  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  isRhvx0 = (myName.toLowerCase() === 'rhvx0');

  player = {
    x: 150, y: 300,
    hp: 10, maxHp: 10,
    name: myName,
    weapon: isRhvx0 ? 'BLASTER' : 'Dýka',
    color: '#6366f1'
  };

  opponent = {
    x: 650, y: 300,
    hp: 10, maxHp: 10,
    name: oppName,
    weapon: 'Dýka',
    color: '#ec4899'
  };

  setupInputs();
  requestAnimationFrame(gameLoop);
}

function resizeCanvas() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}

function setupInputs() {
  window.addEventListener('keydown', e => keys[e.code] = true);
  window.addEventListener('keyup', e => keys[e.code] = false);

  const joystick = document.getElementById('joystick');
  const knob = document.getElementById('knob');
  let center = { x: 0, y: 0 };
  let touchId = null;

  joystick.addEventListener('pointerdown', e => {
    joystickActive = true;
    touchId = e.pointerId;
    const rect = joystick.getBoundingClientRect();
    center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    updateJoystick(e.clientX, e.clientY);
  });

  window.addEventListener('pointermove', e => {
    if (!joystickActive || e.pointerId !== touchId) return;
    updateJoystick(e.clientX, e.clientY);
  });

  window.addEventListener('pointerup', e => {
    if (e.pointerId === touchId) {
      joystickActive = false;
      joystickVector = { x: 0, y: 0 };
      knob.style.transform = `translate(0px, 0px)`;
    }
  });

  function updateJoystick(clientX, clientY) {
    let dx = clientX - center.x;
    let dy = clientY - center.y;
    let dist = Math.hypot(dx, dy);
    let maxDist = 35;

    if (dist > maxDist) {
      dx = (dx / dist) * maxDist;
      dy = (dy / dist) * maxDist;
    }

    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    joystickVector = { x: dx / maxDist, y: dy / maxDist };
  }
}

function triggerHit() {
  let dist = Math.hypot(player.x - opponent.x, player.y - opponent.y);
  if (dist < 90 || isRhvx0) {
    if (isRhvx0) {
      opponent.hp = 0;
    } else {
      opponent.hp = Math.max(0, opponent.hp - 1);
    }
  }
}

function gameLoop() {
  let speed = 4;
  if (keys['KeyW'] || keys['ArrowUp'] || joystickVector.y < -0.2) player.y -= speed;
  if (keys['KeyS'] || keys['ArrowDown'] || joystickVector.y > 0.2) player.y += speed;
  if (keys['KeyA'] || keys['ArrowLeft'] || joystickVector.x < -0.2) player.x -= speed;
  if (keys['KeyD'] || keys['ArrowRight'] || joystickVector.x > 0.2) player.x += speed;

  player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
  player.y = Math.max(40, Math.min(canvas.height - 40, player.y));

  if (Math.random() < 0.03) {
    if (opponent.x > player.x) opponent.x -= 2; else opponent.x += 2;
    if (opponent.y > player.y) opponent.y -= 2; else opponent.y += 2;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = player.color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(player.name + ` (${player.weapon})`, player.x, player.y - 30);

  ctx.fillStyle = opponent.color;
  ctx.beginPath();
  ctx.arc(opponent.x, opponent.y, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(opponent.name, opponent.x, opponent.y - 30);

  document.getElementById('hud-p1').textContent = `${player.name}: ${player.hp} HP`;
  document.getElementById('hud-p2').textContent = `${opponent.name}: ${opponent.hp} HP`;

  if (player.hp > 0 && opponent.hp > 0) {
    requestAnimationFrame(gameLoop);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 28px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(player.hp <= 0 ? 'PROHRÁL JSI!' : 'VÍTĚZSTVÍ!', canvas.width / 2, canvas.height / 2);
  }
}
</script>

</body>
</html>
